<!DOCTYPE html>
<html>
<head>
    <title>Test Array Operations</title>
    <script src="node_modules/ramda/dist/ramda.min.js"></script>
    <script src="js/core/ArrayOperations.js"></script>
</head>
<body>
    <h1>Testing Ramda-powered Array Operations</h1>
    <pre id="output"></pre>
    <script>
        const output = document.getElementById('output');
        let results = [];

        // Test 1D array operations
        const arr1D = ['★', '☆', '✦', '✧'];
        results.push('1D Array: ' + JSON.stringify(arr1D));
        results.push('Reverse: ' + JSON.stringify(ArrayOperations.reverse(arr1D)));
        results.push('Rotate Left: ' + JSON.stringify(ArrayOperations.rotateLeft(arr1D)));
        results.push('Rotate Right: ' + JSON.stringify(ArrayOperations.rotateRight(arr1D)));
        results.push('');

        // Test 2D array operations
        const arr2D = [['◆', '◇'], ['◈', '◊']];
        results.push('2D Array: ' + JSON.stringify(arr2D));
        results.push('Transpose: ' + JSON.stringify(ArrayOperations.transpose(arr2D)));
        results.push('Reverse Rows: ' + JSON.stringify(ArrayOperations.reverseRows(arr2D)));
        results.push('Flatten: ' + JSON.stringify(ArrayOperations.flatten(arr2D)));
        results.push('');

        // Test reshape operations
        const arr6 = ['1', '2', '3', '4', '5', '6'];
        results.push('Array of 6: ' + JSON.stringify(arr6));
        results.push('Reshape 2x3: ' + JSON.stringify(ArrayOperations.reshape2x3(arr6)));
        results.push('Reshape 3x2: ' + JSON.stringify(ArrayOperations.reshape3x2(arr6)));
        results.push('');

        // Test Level 3 solution
        results.push('Level 3 Test:');
        const level3Start = ['★', '☆', '✦', '✧'];
        const level3Target = ['✧', '★', '☆', '✦'];
        results.push('Start: ' + JSON.stringify(level3Start));
        results.push('Target: ' + JSON.stringify(level3Target));
        const afterRotateLeft = ArrayOperations.rotateLeft(level3Start);
        results.push('After Rotate Left: ' + JSON.stringify(afterRotateLeft));
        results.push('Match target? ' + (JSON.stringify(afterRotateLeft) === JSON.stringify(level3Target)));

        output.textContent = results.join('\n');
    </script>
</body>
</html>
